<style>

<script>
(() => {
  const root = document.getElementById('mt-sketch-ui');
  const content = root.querySelector('#mt-content');
  const ic = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const clone = value => JSON.parse(JSON.stringify(value));
  const number = v => new Intl.NumberFormat('id-ID', {maximumFractionDigits:2}).format(v);
  const plate = {x:55,y:50,w:565,h:310};
  let state={view:'peserta',student:[],master:[],pairs:{},selected:'',submitted:false,published:false,noStudent:false,noMaster:false,compare:'side',opacity:65,note:'',result:'Perlu Perbaikan',feedback:false};
  const photos={student:null,master:null};
  const dimensions={student:{length:200,width:200,thickness:5},master:{length:200,width:200,thickness:5}};
  const dimensionsApplied={student:false,master:false};
  const dimensionsEditing={student:false,master:false};
  const defaultDimensions=()=>({length:200,width:200,thickness:5});
  const dimensionText=which=>{const d=dimensions[which];return [d.length,d.width,d.thickness].map(number).join(' × ')+' mm';};
  function validateDimensions(d){
    if(!d||['length','width','thickness'].some(k=>typeof d[k]!=='number'||!Number.isFinite(d[k])||d[k]<=0||d[k]>100000))throw Error('Isi panjang, lebar, dan tebal lebih dari 0 hingga 100.000 mm.');
    return d;
  }
  let dimensionDialog=null;
  function dimensionPanel(){const which=owner(),applied=dimensionsApplied[which]||isLocked();return `<div class="mt-dimension-summary" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;background:var(--mt-soft);border-bottom:1px solid var(--mt-line)"><span class="mt-caption">Dimensi test piece${applied?`: <strong class="mt-mono">${dimensionText(which)}</strong>`:''}</span>${isLocked()?'':button('edit-dimensions',applied?'Edit Dimension':'Add Dimension','','ruler')}</div>`;}
  function openDimensionDialog(){
    if(isLocked())return;captureForm();const d=dimensions[owner()];
    if(!dimensionDialog){dimensionDialog=document.createElement('dialog');dimensionDialog.className='mt-detail-dialog';dimensionDialog.setAttribute('aria-labelledby','mt-dimension-title');root.append(dimensionDialog);}
    dimensionDialog.innerHTML=`<div class="mt-dialog-head"><div><h2 id="mt-dimension-title">Dimensi test piece</h2><p>Masukkan panjang, lebar, dan tebal dalam mm.</p></div>${button('hide-dimensions','Tutup','mt-quiet','x')}</div><form id="mt-dimensions-form" class="mt-form" novalidate><div class="mt-fields">${[['length','Panjang · arah From Y'],['width','Lebar'],['thickness','Tebal']].map(([key,label])=>`<label class="mt-field">${label} (mm)<input name="${key}" inputmode="decimal" value="${esc(d[key])}" required></label>`).join('')}</div><p id="mt-dimension-error" class="mt-error" role="alert" hidden></p><p class="mt-caption" style="margin-top:10px">Template sketch bersifat skematis. Dimensi ditampilkan dalam mm.</p><div class="mt-tool-group" style="margin-top:16px;flex-wrap:wrap"><button type="submit" class="mt-btn mt-primary">Terapkan dimensi</button>${button('hide-dimensions','Batal','mt-quiet','x')}</div></form>`;
    dimensionDialog.showModal();icons();dimensionDialog.querySelector('input').focus();
  }
  async function rotatePhoto(which,direction){
    if(which!==owner()||isLocked()||!photos[which])return;
    captureForm();const source=photos[which];busy=true;
    try{
      const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(Error('Foto tidak dapat diputar. Pilih ulang foto.'));image.src=source;});
      const canvas=document.createElement('canvas');canvas.width=image.height;canvas.height=image.width;
      const ctx=canvas.getContext('2d');if(!ctx)throw Error('Browser tidak mendukung rotasi foto.');
      ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(direction*Math.PI/2);ctx.drawImage(image,-image.width/2,-image.height/2);
      const rotated=canvas.toDataURL('image/jpeg',.8);if(rotated.length>2796200)throw Error('Foto terlalu besar setelah diputar. Pilih foto yang lebih kecil.');
      photos[which]=rotated;draftSaved=false;
    }finally{busy=false;render();}
    toast('Foto diputar 90°. Tekan Simpan draft atau Kirim untuk menyimpan perubahan.');
  }
  let active=null, drawing=false, currentStroke=null, undoStack=[], fileTarget='student', draftSaved=false, photoExpanded={};
  const design={viewport:'Adaptif',grid:true,compact:false};
  let mobileTab='identity';
  let reviewerPaneDrafts={batches:{batchId:'',label:''}};
  state.student=[];state.master=[];state.pairs={};state.selected='';state.note='';
  let user={role:'Peserta',guest:true,userId:'',nama:''}, participantName='', token='', busy=false, records=[], currentPiece='', currentMethod='';
  const METHODS=['Magnetic Particle Testing','Penetrant Testing'];
  let testPieces=[],piecesError='';
  let batches=[],batchesError='',currentBatch='',reviewBatch='';
  let keyMethod='',keyPiece='',keyStatus='';
  let pieceQuery='',pieceKeyMethod='',pieceKeyStatus='';
  let adminData={pieces:[],batches:[],reports:[],keys:[]},showTrash={pieces:false,batches:false,reports:false,keys:false},adminDialog=null,adminEdit=null;
  const batchLabel=id=>{const b=batches.find(b=>b.id===id);return b?b.id+(b.label?' · '+b.label:''):(id||'Tanpa batch (laporan lama)');};
  function filteredReviewRecords(){
    const hasMethod = typeof currentMethod !== 'undefined' && currentMethod;
    const hasPiece = typeof currentPiece !== 'undefined' && currentPiece && (typeof state !== 'undefined' && state.view === 'penguji');
    return records.filter(r=>r.kind==='student'&&r.status!=='Draft'&&(!reviewBatch||(reviewBatch==='__UNASSIGNED__'?!r.batch:r.batch===reviewBatch))&&(!hasMethod||r.method===currentMethod)&&(!hasPiece||r.piece===currentPiece));
  }
  function batchFilter(){const ids=[...new Set([...batches.map(b=>b.id),...records.filter(r=>r.kind==='student'&&r.batch).map(r=>r.batch)])].sort();return `<label class="mt-field full">Filter batch pemeriksaan<select id="mt-batch-filter"><option value="">Semua batch</option>${ids.map(id=>`<option value="${esc(id)}" ${reviewBatch===id?'selected':''}>${esc(batchLabel(id))}</option>`).join('')}<option value="__UNASSIGNED__" ${reviewBatch==='__UNASSIGNED__'?'selected':''}>Tanpa batch (laporan lama)</option></select><span>${filteredReviewRecords().length} laporan terkirim dalam filter ini</span></label>`;}
  const loaded={student:null,master:null};let pending=null, reviseSource={student:null,master:null};
  function api(action,payload={}) {
    if(!globalThis.google?.script?.run)return Promise.reject(Error('Buka aplikasi melalui URL deployment Google Apps Script.'));
    return new Promise((resolve,reject)=>{
      const timer=setTimeout(()=>reject(Error('Server belum merespons dalam 45 detik. Jangan tutup halaman. Periksa koneksi lalu coba simpan/kirim lagi.')),45000);
      const fail=e=>{clearTimeout(timer);reject(Error(e.message||String(e)));};
      google.script.run.withSuccessHandler(r=>{clearTimeout(timer);if(r?.success)resolve(r.data);else reject(Error(r?.message||'Server tidak mengembalikan hasil.'));}).withFailureHandler(fail).mtApi(action,{...payload,token});
    });
  }
  function resumeKey(create=false){try{let key=localStorage.getItem('mt-resume-key');if(!key&&create){key=crypto.randomUUID()+crypto.randomUUID();localStorage.setItem('mt-resume-key',key);}return key||'';}catch(error){return '';}}
  function rememberGuest(){try{if(user?.guest&&token)sessionStorage.setItem('mt-guest-session',JSON.stringify({user,token}));}catch(error){}}
  async function resumeGuest(create=false){
    if(!user?.guest)return;
    const key=resumeKey(create||!!token);if(!key&&!token){if(!create)return;}
    const r=await api('participant',{nama:participantName||user.nama,resumeKey:key});
    user=r.user;token=r.token;if(!participantName)participantName=user.nama;rememberGuest();
  }
  async function refreshBatches(){try{batches=await api('batches');batchesError='';}catch(error){batchesError=error.message;throw error;}}
  async function refreshPieces(){try{testPieces=await api('testPieces');piecesError='';}catch(error){piecesError=error.message;throw error;}}
  async function refreshRecords(){if(user?.role==='Peserta'){records=[];return;}records=token?await api('list'):[];if(token&&user?.role==='Penguji')adminData=await api('adminList');}

  async function ensureParticipant(){
    if(user?.role!=='Peserta'||!user.guest)return;
    const name=participantName.trim();if(name.length<2||name.length>120)throw Error('Isi Nama peserta terlebih dahulu (2–120 karakter).');
    await resumeGuest(true);
    if(user.nama!==name)user=await api('rename',{nama:name});
    rememberGuest();
  }

  function connectionPanel(){

      choose(id||list()[0]?.id);render();openDetails();return;
    }
    if(action==='clear-strokes'&&active&&!isLocked()){captureForm();active.strokes=[];currentStroke=null;drawing=true;render();return;}
    if(action==='cancel-edit'){choose(active?.id);render();return;}
    if(action==='upload'||action==='camera'){captureForm();fileTarget=btn.dataset.owner;const input=root.querySelector(action==='camera'?'#mt-camera':'#mt-file');input.value='';input.click();return;}
    if(action==='rotate-photo'){await rotatePhoto(btn.dataset.owner,Number(btn.dataset.direction)===-1?-1:1);return;}
    if(action==='remove-photo'){photos[btn.dataset.owner]=null;render();toast('Foto dilepas dari pratinjau laporan.');return;}
    if(action==='zoom-photo'){photoExpanded[btn.dataset.owner]=!photoExpanded[btn.dataset.owner];render();return;}
    if(action==='save-review'){state.note=root.querySelector('#mt-review-note').value;state.result=root.querySelector('#mt-result').value;if(state.result==='Perlu Perbaikan'&&!state.note.trim()){toast('Tambahkan catatan perbaikan untuk peserta.');return;}state.feedback=root.querySelector('#mt-publish-feedback').checked;
      if(!loaded.student)throw Error('Pilih laporan peserta dahulu.');busy=true;
      try{loaded.student=await api('evaluate',{id:loaded.student.id,revision:loaded.student.revision,keyId:loaded.master?.id||null,result:state.result,note:state.note,pairs:state.pairs,published:state.feedback});await refreshRecords();}finally{busy=false;render();}
      toast('Evaluasi berhasil disimpan'+(state.feedback?' dan catatan tersedia untuk peserta.':'.'));}
  }catch(e){busy=false;toast((e.message||String(e))+' Perubahan yang belum tersimpan tetap ada di halaman ini; coba Simpan draft kembali.');}});
  root.addEventListener('submit',async e=>{
    e.preventDefault();
    if(e.target.id==='mt-admin-form'){await commitAdmin('save');return;}
    if(e.target.id==='mt-dimensions-form'){
      if(busy||isLocked())return;
      try{const next={};for(const key of ['length','width','thickness']){const raw=e.target.elements.namedItem(key).value.trim();if(!/^\d+(?:[.,]\d{1,2})?$/.test(raw))throw Error('Isi dimensi dengan angka, maksimal 2 desimal.');next[key]=Number(raw.replace(',','.'));}validateDimensions(next);
        if(list().some(i=>Number(i.fromY)>next.length)||active&&active.fromY!==''&&Number(String(active.fromY).replace(',','.'))>next.length)throw Error('Panjang test piece lebih kecil dari From Y indikasi. Perbaiki posisi indikasi dahulu.');
        captureForm();dimensions[owner()]=next;dimensionsApplied[owner()]=true;dimensionsEditing[owner()]=false;draftSaved=false;dimensionDialog?.close();render();toast('Dimensi diterapkan. Tekan Simpan draft atau Kirim untuk menyimpan ke server.');
      }catch(error){const el=e.target.querySelector('#mt-dimension-error');el.textContent=error.message;el.hidden=false;}return;
    }
    if(e.target.id==='mt-batch-form'){
      if(busy)return;const form=e.target,submit=form.querySelector('button'),errorEl=form.querySelector('#mt-batch-error');busy=true;submit.disabled=true;errorEl.hidden=true;
      try{await api('addBatch',{id:form.elements.namedItem('batchId').value,label:form.elements.namedItem('label').value});reviewerPaneDrafts.batches={batchId:'',label:''};await refreshBatches();busy=false;render();toast('Batch berhasil ditambahkan. Peserta dapat memilihnya pada tab Data.');}
      catch(error){errorEl.textContent=error.message;errorEl.hidden=false;}finally{busy=false;submit.disabled=false;}return;
    }
    if(e.target.id==='mt-piece-form'){
      if(busy)return;const form=e.target,submit=form.querySelector('button'),errorEl=form.querySelector('#mt-piece-error');busy=true;submit.disabled=true;errorEl.hidden=true;
      let committed=false;try{await api('addTestPiece',{id:form.elements.namedItem('pieceId').value,label:form.elements.namedItem('label').value});committed=true;testPieceDialog?.close();await refreshPieces();await refreshRecords();busy=false;render();toast('Test Piece berhasil ditambahkan.');}
      catch(error){if(committed){busy=false;render();toast('Test Piece sudah ditambahkan. Tekan Muat ulang untuk memperbarui daftar.');}else{errorEl.textContent=error.message;errorEl.hidden=false;}}finally{busy=false;submit.disabled=false;}return;
    }
    if(e.target.id!=='mt-reviewer-form'||busy)return;
    const form=e.target,submit=form.querySelector('button[type="submit"]'),errorEl=form.querySelector('#mt-reviewer-error');
    busy=true;submit.disabled=true;submit.textContent='Memeriksa…';errorEl.hidden=true;
    try{
      const result=await api('reviewerLogin',{password:form.elements.namedItem('password').value});
      persist();rememberGuest();resetWorking();user=result.user;token=result.token;state.view='penguji';rememberReviewerSession();
      reviewerDialog.close();form.reset();await refreshRecords();
    }catch(error){errorEl.textContent=error.message;errorEl.hidden=false;}
    finally{busy=false;submit.disabled=false;submit.textContent='Masuk';if(!reviewerDialog.open)render();}
  });
  root.addEventListener('input',event=>{
    captureForm();captureReviewerPane();
    if(event.target.id==='mt-piece')currentPiece=event.target.value.trim();
    if(event.target.id==='mt-participant-name'){
      participantName=event.target.value;
      const method=root.querySelector('#mt-method');if(method)method.disabled=isLocked()||participantName.trim().length<2;
      const piece=root.querySelector('#mt-piece');if(piece)piece.disabled=isLocked()||!currentMethod||participantName.trim().length<2;
    }
    if(event.target.id==='mt-opacity'){state.opacity=Number(event.target.value);root.querySelector('#mt-opacity-value').textContent=state.opacity+'%';root.querySelector('#mt-overlay-preview [data-layer="student"]').setAttribute('opacity',state.opacity/100);persist();}
    if(event.target.id==='mt-review-note')state.note=event.target.value;
    persist();
  });
  root.addEventListener('change',async event=>{try{
    if(['mt-piece-query','mt-piece-key-method','mt-piece-key-status'].includes(event.target.id)){if(event.target.id==='mt-piece-query')pieceQuery=event.target.value;else if(event.target.id==='mt-piece-key-method')pieceKeyMethod=event.target.value;else pieceKeyStatus=event.target.value;render();return;}
    if(['mt-key-method','mt-key-piece','mt-key-status'].includes(event.target.id)){if(event.target.id==='mt-key-method')keyMethod=event.target.value;else if(event.target.id==='mt-key-piece')keyPiece=event.target.value;else keyStatus=event.target.value;render();return;}
    if(event.target.id==='mt-batch'){if(!isLocked()){currentBatch=event.target.value;draftSaved=false;persist();}return;}
    if(event.target.id==='mt-batch-filter'){captureForm();reviewBatch=event.target.value;loaded.student=null;loaded.master=null;state.student=[];state.master=[];photos.student=null;photos.master=null;active=null;drawing=false;render();return;}
    if(event.target.id==='mt-method'){captureForm();currentMethod=event.target.value;if(state.view==='penguji'){loaded.student=null;loaded.master=null;state.student=[];state.master=[];photos.student=null;photos.master=null;active=null;drawing=false;}else{currentPiece='';}render();persist();return;}
    if(event.target.id==='mt-piece'){currentPiece=event.target.value.trim();if(state.view==='penguji'){loaded.student=null;loaded.master=null;state.student=[];state.master=[];photos.student=null;photos.master=null;active=null;drawing=false;render();}else{captureForm();render();}persist();return;}
    if(event.target.id==='mt-record'&&event.target.value){if(busy)return;await openSavedReport(event.target.value);return;}

    if(event.target.dataset.pair){const key=event.target.dataset.pair,value=event.target.value;Object.keys(state.pairs).forEach(k=>{if(k!==key&&state.pairs[k]===value)state.pairs[k]='';});state.pairs[key]=value;render();persist();}
    if(event.target.id==='mt-no-indications'){state[owner()==='master'?'noMaster':'noStudent']=event.target.checked;persist();}
    if(event.target.id==='mt-result')state.result=event.target.value;
  }catch(e){toast(e.message);}});
  for(const input of root.querySelectorAll('input[type="file"]'))input.addEventListener('change',()=>{
    const file=input.files?.[0];if(!file)return;
    if(!['image/jpeg','image/png'].includes(file.type)){toast('Pilih foto JPG atau PNG untuk pratinjau ini.');return;}
    if(file.size>10*1024*1024){toast('Ukuran foto maksimal 10 MB.');return;}
    const target=fileTarget,reader=new FileReader();reader.onerror=()=>toast('Foto belum dapat dibaca. Silakan pilih ulang.');reader.onload=()=>{const test=new Image();test.onerror=()=>toast('File gambar tidak dapat dibuka.');test.onload=()=>{const canvas=document.createElement('canvas'),scale=Math.min(1,2000/Math.max(test.width,test.height));canvas.width=Math.round(test.width*scale);canvas.height=Math.round(test.height*scale);canvas.getContext('2d').drawImage(test,0,0,canvas.width,canvas.height);const photo=canvas.toDataURL('image/jpeg',.8);if(photo.length>2796200){toast('Foto terlalu besar setelah kompresi. Pilih foto berukuran lebih kecil.');return;}photos[target]=photo;render();toast('Foto siap. Tekan Simpan draft atau Kirim untuk menyimpannya ke Drive.');};test.src=reader.result;};reader.readAsDataURL(file);
  });
  function point(e,svg){const r=svg.getBoundingClientRect();return [Math.round(Math.max(0,Math.min(1,((e.clientX-r.left)*760/r.width-plate.x)/plate.w))*1000)/1000,Math.round(Math.max(0,Math.min(1,((e.clientY-r.top)*440/r.height-plate.y)/plate.h))*1000)/1000];}
  function updateDrawing(svg){const preview=svg.querySelector('.mt-draft-strokes');const exists=list().some(v=>v.id===active.id);if(exists){const old=svg.querySelector(`[data-select="${active.id}"]`);if(old)old.remove();}preview.innerHTML=mark(active,'','var(--mt-accent)',false,false,true);}
  root.addEventListener('pointerdown',e=>{const svg=e.target.closest('svg[data-editor]');if(!svg||!drawing||!active||isLocked())return;e.preventDefault();svg.setPointerCapture(e.pointerId);const p=point(e,svg);currentStroke=[p,[Math.min(1,p[0]+.001),Math.min(1,p[1]+.001)]];active.strokes.push(currentStroke);updateDrawing(svg);});
  root.addEventListener('pointermove',e=>{if(!currentStroke||!drawing)return;const svg=root.querySelector('svg[data-editor]');if(!svg)return;const p=point(e,svg),last=currentStroke[currentStroke.length-1];if(Math.hypot(p[0]-last[0],p[1]-last[1])>.004&&currentStroke.length<200)currentStroke.push(p);updateDrawing(svg);});
  function endStroke(){if(!currentStroke)return;currentStroke=null;const undo=root.querySelector('[data-action="undo"]');if(undo)undo.disabled=false;persist();}
  root.addEventListener('pointerup',endStroke);root.addEventListener('pointercancel',endStroke);
  content.addEventListener('pointerdown',reviewerSwipeStart);
  content.addEventListener('pointermove',reviewerSwipeMove);
  content.addEventListener('pointerup',reviewerSwipeEnd);
  content.addEventListener('pointercancel',()=>{reviewerSwipe=null;});
  const observer=new ResizeObserver(resizeLabels);observer.observe(root);
  try{const saved=JSON.parse(sessionStorage.getItem('mt-guest-session')||'null');if(saved?.user?.guest&&saved.user.role==='Peserta'&&typeof saved.token==='string'){user=saved.user;token=saved.token;participantName=user.nama;}}catch(e){}
  window.addEventListener('beforeunload',()=>{captureForm();persist();});
  window.addEventListener('pagehide',()=>{captureForm();persist();});
  async function initializeApplication(){
    const savedReviewer=readReviewerSession();let resumed=false;
    if(savedReviewer){content.innerHTML='<section class="mt-box mt-form" role="status">Memulihkan sesi penguji…</section>';try{resumed=await restoreReviewerSession(savedReviewer);}catch(error){render();toast('Sesi penguji belum dapat diperiksa. Periksa koneksi lalu refresh.');return;}}
    const recoveredDraft=resumed?null:restoreDraft();
    if(resumed&&state.view==='kunci'&&!savedReviewer.reportId)state.view='pieces';
    render();if(recoveredDraft?.dialogOpen&&active&&!drawing)openDetails();if(recoveredDraft)toast('Draft dipulihkan setelah refresh.');
    if(savedReviewer&&!resumed)toast('Sesi penguji sudah berakhir. Pilih Penguji untuk masuk kembali.');
    try{
      await Promise.all([refreshBatches(),refreshPieces()]);await refreshRecords();
      if(resumed&&savedReviewer.reportId&&['penguji','kunci'].includes(state.view)){
        const expected=state.view==='kunci'?'master':'student',found=records.find(r=>r.id===savedReviewer.reportId&&r.kind===expected);
        if(found)applyDocument(await api('load',{id:found.id}));else if(state.view==='kunci')state.view='pieces';
      }
      render();if(recoveredDraft?.dialogOpen&&active&&!drawing)openDetails();
    }catch(error){toast('Data halaman tetap ada. Daftar server belum bisa dimuat: '+error.message);}
  }
  initializeApplication();
})();
</script>
